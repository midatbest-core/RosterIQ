  <rect x="32" y="1" width="3" height="6" rx="1.5" fill="#818cf8"/>

  <!-- Roster Shift Grid (Dots) -->
  <circle cx="12" cy="22" r="2" fill="#6366f1" fill-opacity="0.7"/>
  <circle cx="20" cy="22" r="2" fill="#818cf8" fill-opacity="0.9"/>
  <circle cx="28" cy="22" r="2" fill="#6366f1" fill-opacity="0.7"/>
  <circle cx="36" cy="22" r="2" fill="#818cf8" fill-opacity="0.9"/>

  <circle cx="12" cy="30" r="2" fill="#818cf8" fill-opacity="0.9"/>
  <circle cx="12" cy="38" r="2" fill="#6366f1" fill-opacity="0.7"/>

  <!-- Dynamic Optimal Checkmark / Allocation Vector -->
