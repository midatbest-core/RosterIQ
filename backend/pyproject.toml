[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosteriq-backend"
version = "0.1.0"
description = "RosterIQ modular monolith backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "bcrypt>=4.2,<6",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

